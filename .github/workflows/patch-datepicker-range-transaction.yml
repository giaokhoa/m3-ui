name: Patch DatePicker range transaction

on:
  push:
    branches:
      - refactor/extract-datepicker-onkeydown-9122404013159643607

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-datepicker-onkeydown-9122404013159643607
      - name: Patch range transaction boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/ui/src/components/DatePicker/DatePicker.tsx')
          source = source_path.read_text()
          old_signature = """function DateInput({ value, onChange, yearRange, unavailable, disabled, focusOnMount, label = 'Date' }: {
            value: DatePickerDate | null;
            onChange: (value: DatePickerDate | null, valid: boolean) => void;
            yearRange: readonly [number, number];"""
          new_signature = """function DateInput({ value, onChange, onCommit, yearRange, unavailable, disabled, focusOnMount, label = 'Date' }: {
            value: DatePickerDate | null;
            onChange: (value: DatePickerDate | null, valid: boolean) => void;
            onCommit?: (value: DatePickerDate | null, valid: boolean) => void;
            yearRange: readonly [number, number];"""
          if old_signature in source:
              source = source.replace(old_signature, new_signature, 1)
              old_change = """      autoFocus={focusOnMount}
                onChange={(next) => {
                  setDraft(next);
                  const iso = next?.toString() ?? null;
                  const valid = iso === null || (isWithinYearRange(iso, yearRange) && !unavailable?.(iso));
                  onChange(iso, valid);
                }}"""
              new_change = """      autoFocus={focusOnMount}
                onBlur={(event) => {
                  if (event.currentTarget.contains(event.relatedTarget as Node | null)) return;
                  const iso = draft?.toString() ?? null;
                  const valid = iso === null || (isWithinYearRange(iso, yearRange) && !unavailable?.(iso));
                  onCommit?.(iso, valid);
                }}
                onChange={(next) => {
                  setDraft(next);
                  const iso = next?.toString() ?? null;
                  const valid = iso === null || (isWithinYearRange(iso, yearRange) && !unavailable?.(iso));
                  onChange(iso, valid);
                }}"""
              if old_change not in source:
                  raise SystemExit('DateInput onChange block not found')
              source = source.replace(old_change, new_change, 1)
              old_start = """                onChange={(next, valid) => { setStartDraft(next); if (valid) commitDraft(next, endDraft); }}"""
              new_start = """                onChange={(next) => setStartDraft(next)}
                        onCommit={(next, valid) => { if (valid) commitDraft(next, endDraft); }}"""
              old_end = """                onChange={(next, valid) => { setEndDraft(next); if (valid) commitDraft(startDraft, next); }}"""
              new_end = """                onChange={(next) => setEndDraft(next)}
                        onCommit={(next, valid) => { if (valid) commitDraft(startDraft, next); }}"""
              if old_start not in source or old_end not in source:
                  raise SystemExit('Range DateInput callbacks not found')
              source = source.replace(old_start, new_start, 1).replace(old_end, new_end, 1)
              source_path.write_text(source)
          elif 'onCommit?: (value: DatePickerDate | null, valid: boolean) => void;' not in source:
              raise SystemExit('DateInput signature not found')

          test_path = Path('apps/storybook/visual/date-picker.visual.spec.ts')
          test = test_path.read_text()
          old_test = """    await enterSegmentedDate(fields.nth(0), '2026-09-10');
              await enterSegmentedDate(fields.nth(1), '2026-09-01');
              await expect(page.getByRole('alert')).toContainText('End date must');"""
          new_test = """    await enterSegmentedDate(fields.nth(0), '2026-09-10');
              await enterSegmentedDate(fields.nth(1), '2026-09-01');
              await page.getByTestId('range-input-value').click();
              await expect(page.getByRole('alert')).toContainText('End date must');"""
          if old_test in test:
              test_path.write_text(test.replace(old_test, new_test, 1))
          elif new_test not in test:
              raise SystemExit('Range browser contract block not found')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- packages/ui/src/components/DatePicker/DatePicker.tsx apps/storybook/visual/date-picker.visual.spec.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/ui/src/components/DatePicker/DatePicker.tsx apps/storybook/visual/date-picker.visual.spec.ts
          git commit -m 'fix(DatePicker): commit range drafts at field boundary'
          git push origin HEAD:refactor/extract-datepicker-onkeydown-9122404013159643607
