name: Temporary clsx migration

on:
  push:
    branches:
      - refactor/standardize-clsx-class-composition

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/standardize-clsx-class-composition
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Migrate class composition
        run: node packages/ui/scripts/migrate-clsx.mjs
      - name: Build UI dependency
        run: pnpm --filter @m3-ui/tokens build
      - name: Test UI
        run: pnpm --filter @m3-ui/ui test
      - name: Typecheck UI
        run: pnpm --filter @m3-ui/ui typecheck
      - name: Build UI
        run: pnpm --filter @m3-ui/ui build
      - name: Remove temporary migration tooling
        run: rm packages/ui/scripts/migrate-clsx.mjs .github/workflows/clsx-migration.yml
      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(ui): standardize dynamic class composition with clsx"
          git push origin HEAD:refactor/standardize-clsx-class-composition
