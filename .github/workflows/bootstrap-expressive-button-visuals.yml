# Temporary one-shot workflow; remove after expressive Button baselines are committed.
name: Bootstrap expressive Button visual baselines

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-expressive-button-visuals.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feat/complete-button-family'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @m3/storybook exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Generate expressive Button baselines
        run: pnpm --filter @m3/storybook test:visual:update

      - name: Commit generated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record expressive Button visual baselines"
          git push
