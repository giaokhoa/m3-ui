name: Docs layout audit

on:
  push:
    branches: [audit/docs-layout-screenshot]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @m3-ui/storybook exec playwright install --with-deps --only-shell chromium
      - name: Start docs
        shell: bash
        run: |
          set -euo pipefail
          setsid pnpm dev > /tmp/m3-ui-dev.log 2>&1 &
          dev_pid=$!
          echo "$dev_pid" > /tmp/m3-ui-dev.pid
          for _ in {1..90}; do
            if curl --fail --silent http://127.0.0.1:4173/docs/components/button >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              cat /tmp/m3-ui-dev.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/m3-ui-dev.log
          exit 1
      - name: Capture screenshots and hydration diagnostics
        shell: bash
        run: |
          mkdir -p audit-screenshots
          pnpm --filter @m3-ui/storybook exec node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1920, height: 1080 }, colorScheme: 'light' });
          const consoleErrors = [];
          const failedResponses = [];
          page.on('console', (msg) => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('pageerror', (err) => consoleErrors.push(`pageerror: ${err.message}`));
          page.on('response', (response) => {
            if (response.status() >= 400) failedResponses.push({ status: response.status(), url: response.url() });
          });

          const inspect = async (label) => page.evaluate((label) => {
            const box = (selector) => {
              const el = document.querySelector(selector);
              if (!el) return null;
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return { selector, x: r.x, y: r.y, width: r.width, height: r.height, display: s.display, borderInlineEnd: s.borderInlineEnd };
            };
            return {
              label,
              innerWidth: window.innerWidth,
              rootClientWidth: document.documentElement.clientWidth,
              rail: box('.docs-global-rail'),
              drawer: box('.docs-permanent-drawer'),
              multiPane: box('.docs-multi-pane'),
              stage: box('.docs-navigation-stage'),
              bodyTextStart: document.body.innerText.slice(0, 160),
              scripts: [...document.scripts].map((s) => s.src).filter(Boolean),
            };
          }, label);

          await page.goto('http://localhost:4173/docs/components/button', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1000);
          const before = await inspect('before-resize');
          await page.screenshot({ path: '../../audit-screenshots/button-1920-before.png', fullPage: false });

          await page.evaluate(() => window.dispatchEvent(new Event('resize')));
          await page.waitForTimeout(500);
          const after = await inspect('after-resize');
          await page.screenshot({ path: '../../audit-screenshots/button-1920-after-resize.png', fullPage: false });

          await fs.writeFile('../../audit-screenshots/diagnostics.json', JSON.stringify({ before, after, consoleErrors, failedResponses }, null, 2));
          await browser.close();
          EOF
      - name: Upload audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: docs-layout-audit
          path: audit-screenshots
          if-no-files-found: error
          retention-days: 1
      - name: Stop docs
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/m3-ui-dev.pid ]; then
            pid=$(cat /tmp/m3-ui-dev.pid)
            pkill -TERM -s "$pid" 2>/dev/null || true
          fi
