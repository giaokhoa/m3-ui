name: Bootstrap Button visual baselines

on:
  push:
    branches:
      - feat/complete-button-family
    paths:
      - .github/workflows/bootstrap-button-visuals.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @m3/storybook exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Generate Button visual baselines
        run: pnpm --filter @m3/storybook test:visual:update

      - name: Commit generated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/storybook/visual/__screenshots__
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record Button visual baselines"
          git push
