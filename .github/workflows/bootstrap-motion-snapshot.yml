name: Bootstrap adaptive motion snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Chromium headless shell
        run: pnpm --filter @m3-ui/storybook exec playwright install --with-deps --only-shell chromium
      - name: Regenerate motion snapshot
        run: |
          rm -f apps/storybook/visual/__screenshots__/list-detail-pane-scaffold.visual.spec.ts/list-detail-pane-scaffold-motion-halfway.png
          pnpm --filter @m3-ui/storybook exec playwright test visual/list-detail-pane-scaffold.visual.spec.ts --update-snapshots
      - name: Upload motion snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-motion-snapshot
          path: apps/storybook/visual/__screenshots__/list-detail-pane-scaffold.visual.spec.ts/list-detail-pane-scaffold-motion-halfway.png
          if-no-files-found: error
