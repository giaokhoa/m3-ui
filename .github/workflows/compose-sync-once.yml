name: Compose sync one-shot

on:
  push:
    branches:
      - infra/compose-token-sync-all
    paths:
      - .compose-sync-once

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: infra/compose-token-sync-all

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate complete pinned token directory
        run: node scripts/compose-sync/index.mjs

      - name: Commit generated snapshot
        run: |
          git add packages/tokens/src/generated/androidx
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "infra: generate full AndroidX token directory"
          git push origin HEAD:infra/compose-token-sync-all
