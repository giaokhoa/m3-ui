name: Compose sync bootstrap

on:
  push:
    branches:
      - infra/compose-token-sync-all

concurrency:
  group: compose-sync-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: infra/compose-token-sync-all

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate all pinned AndroidX token modules
        run: node scripts/compose-sync/index.mjs

      - name: Commit generated snapshot when changed
        run: |
          git add packages/tokens/src/generated/androidx
          if git diff --cached --quiet; then
            echo "Generated snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "infra: generate complete AndroidX token snapshot"
          git push origin HEAD:infra/compose-token-sync-all
