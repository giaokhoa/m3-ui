name: Refresh docs Next.js lockfile

on:
  pull_request:
    paths:
      - apps/docs/package.json
      - .github/workflows/docs-next-lockfile.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: docs-next-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
