name: Material upstream freshness

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

concurrency:
  group: material-freshness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Check reviewed Material pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Probe relevant upstream freshness
        run: pnpm --filter @m3-ui/tokens freshness:upstream
