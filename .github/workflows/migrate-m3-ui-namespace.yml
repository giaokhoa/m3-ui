name: Migrate m3-ui namespace

on:
  push:
    branches:
      - fix/m3-ui-namespace-storybook

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Migrate workspace namespace
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            sed -i 's/@m3\//@m3-ui\//g' "$file"
          done < <(git grep -Ilz '@m3/' -- ':!pnpm-lock.yaml')

          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts.storybook = 'pnpm --filter @m3-ui/storybook^... build && pnpm --filter @m3-ui/storybook dev';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          pnpm install --no-frozen-lockfile

      - name: Assert legacy namespace is gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n '@m3/' -- ':!pnpm-lock.yaml'; then
            echo 'Legacy @m3/* references remain' >&2
            exit 1
          fi
          if grep -n '@m3/' pnpm-lock.yaml; then
            echo 'Legacy @m3/* references remain in pnpm-lock.yaml' >&2
            exit 1
          fi

      - name: Validate build
        run: |
          pnpm build
          pnpm build:storybook

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/migrate-m3-ui-namespace.yml
          git commit -m 'fix: migrate workspace packages to @m3-ui scope'
          git push origin HEAD:fix/m3-ui-namespace-storybook
