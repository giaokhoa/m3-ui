# Temporary one-shot workflow; remove after TextField baselines are reviewed.
name: Bootstrap TextField visual baselines

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-text-field-visuals.yml

permissions:
  contents: read

jobs:
  review-artifact:
    if: github.head_ref == 'feat/text-field-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Upload TextField visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: text-field-visual-baselines
          path: apps/storybook/visual/__screenshots__/text-field.visual.spec.ts/*.png
          if-no-files-found: error
