# Temporary one-shot workflow; remove after TextField baselines are reviewed.
name: Bootstrap TextField visual baselines

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-text-field-visuals.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feat/text-field-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium headless shell
        run: pnpm --filter @m3/storybook exec playwright install --with-deps --only-shell chromium

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Refresh TextField baselines
        run: pnpm --filter @m3/storybook exec playwright test visual/text-field.visual.spec.ts --update-snapshots

      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__/text-field.visual.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: refresh TextField visual baselines"
          git push

      - name: Upload refreshed baselines
        uses: actions/upload-artifact@v4
        with:
          name: text-field-visual-baselines-final-review
          path: apps/storybook/visual/__screenshots__/text-field.visual.spec.ts/*.png
          if-no-files-found: error
