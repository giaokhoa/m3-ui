name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  verify:
    name: Commit IconButton visual baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/icon-button-parity
      - name: Download validated baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps/storybook/visual/__screenshots__/icon-button.visual.spec.ts
          gh api /repos/${{ github.repository }}/actions/artifacts/9494139649/zip > /tmp/icon-button-baselines.zip
          unzip -o /tmp/icon-button-baselines.zip -d apps/storybook/visual/__screenshots__/icon-button.visual.spec.ts
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__/icon-button.visual.spec.ts
          git commit -m "test(storybook): add IconButton visual baselines"
          git push origin HEAD:feat/icon-button-parity
