name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  verify:
    name: Commit FAB visual baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FAB branch
        uses: actions/checkout@v7
        with:
          ref: feat/fab-parity
          fetch-depth: 1
      - name: Download FAB visual baselines
        uses: actions/download-artifact@v5
        with:
          name: fab-visual-baselines
          path: apps/storybook/visual/__screenshots__/fab.visual.spec.ts
          github-token: ${{ github.token }}
          run-id: 32655922831
      - name: Restore standard CI workflow
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit FAB visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__/fab.visual.spec.ts .github/workflows/ci.yml
          git commit -m "test(storybook): add FAB visual baselines"
          git push origin HEAD:feat/fab-parity
